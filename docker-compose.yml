services:
  # Open WebUI, connected to the Ollama instance running on the host (Phase 0).
  # On the real Brain hardware this will instead point at vLLM's OpenAI-compatible
  # endpoint via OPENAI_API_BASE_URL - see PROJECT_PLAN.md for the phase roadmap.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: brain-demo-open-webui
    ports:
      - "3000:8080"
    environment:
      # host.docker.internal lets the container reach Ollama running on the Mac host.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_AUTH=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

  # Vector database for Test 3 (RAG). Plain open source Qdrant, no auth for
  # this local demo.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: brain-demo-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  open-webui-data:
  qdrant-data:
